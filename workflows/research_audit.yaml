# Optional research audits during an author pause. Edit audit instructions here.
defaults:
  intervalHours: 2
  models: [none, none, none]

# Each auditor is cancelled after this many minutes; the prompt asks for the
# executive summary first so a cancelled run still leaves nothing half-written.
timeoutMinutes: 25

# A fresh-eyes solver runs with every batch when a research run has
# INITIAL_PROMPT.md. It sees only the statement and a one-page brief (PLAN and
# lemma statements), never the records, and must propose a complete candidate
# algorithm. "slot-1" means the model selected for auditor slot 1.
solver:
  enabled: true
  model: slot-1

# Model IDs and maximum supported reasoning effort belong here, not in Python.
# Refresh explicit IDs when providers release stronger models.
models:
  - {value: none, label: None}
  - {value: gpt-6-astra, label: GPT Astra (Ultra), provider: codex, model: gpt-6-astra, effort: ultra}
  - {value: gpt-5.6-sol, label: GPT Sol (Ultra), provider: codex, model: gpt-5.6-sol, effort: ultra}
  - {value: gpt-5.6-terra, label: GPT Terra (Ultra), provider: codex, model: gpt-5.6-terra, effort: ultra}
  - {value: gpt-5.6-luna, label: GPT Luna (Max), provider: codex, model: gpt-5.6-luna, effort: max}
  - {value: claude-fable, label: Claude Fable 5.1 (Max), provider: claude, model: claude-fable-5-1, effort: max}
  - {value: claude-opus, label: Claude Opus (Max), provider: claude, model: opus, effort: max}
  - {value: claude-sonnet, label: Claude Sonnet (Max), provider: claude, model: sonnet, effort: max}
  - {value: claude-haiku, label: Claude Haiku, provider: claude, model: haiku}
  - {value: kimi-k3, label: Kimi K3 (Max), provider: kimi, model: kimi-code/k3, effort: max}
  - {value: kimi-code, label: Kimi Code (Max), provider: kimi, model: kimi-code/kimi-for-coding, effort: max}

# Auditors read the paused author's actual workspace; no research copy is made.
# Before a batch starts, move previous reports from output into history.
output: AUDITS
history: audit_history

# EDIT AUDIT PROMPT HERE: advice only; the author owns research file management.
# The controller merges the VERDICT, DIRECTION and PREMISE lines of every report
# into audit-digest.md, which is what the author reads first.
prompt: |-
  You are an independent research adviser reviewing a saved research trajectory.
  You are working directly in the paused author's workspace with read-only tools.
  Do not edit any files or delegate the audit. Form your own assessment; do not
  read AUDITS/ or audit_history/ or rely on peer reports. The controller has moved
  previous reports to audit_history/ and will save your final Markdown response
  into AUDITS/. Only the controller manages these folders.
  The original task is in INITIAL_PROMPT.md. The author's records are
  APPROACHES/index.md (starting with a PLAN section), APPROACHES/A*.md nodes, and
  PROVED.md lemmas. You have about 20 minutes; write the executive summary first
  and keep the whole report under 2,500 words.

  PHASE 0 (before opening APPROACHES/ or PROVED.md): read only the STATEMENT in
  INITIAL_PROMPT.md and write a one-page plan of how you would attack it today,
  naming the two or three standard theorems you would lean on and, for each,
  whether you would use it constructively or only existentially. Save it verbatim
  as Section 1 of your report.

  PHASE 1: read APPROACHES/index.md (PLAN first), every ACTIVE node, then the
  lemmas they cite (statements first; proofs only where a verdict depends on
  them). Report which files you read in full.

  PHASE 2 (premise audit), with lemma IDs: (a) for each ACTIVE node, the WEAKEST
  object its downstream consumer needs versus the STRONGER object the node builds;
  (b) every existence lemma the author is trying to make constructive, and whether
  existence plus a feasibility, LP, or flow argument on some auxiliary network
  would suffice; (c) whether the author represents a law that a maintained sample
  plus a repair step could replace; (d) the author's top three unexamined
  assumptions and how your Phase-0 plan differs on each; (e) which of your Phase-0
  ingredients has no node.

  PHASE 3 (verdicts): for every ACTIVE node exactly one of CONTINUE (name the
  single theorem that would finish it), STOP (evidence: consecutive descendants
  ending in "bound remains open", or a lower bound the author already proved), or
  REDIRECT (name the replacement objective). Never CONTINUE a node whose last three
  descendants added only interfaces, static tools, or counterexamples to the
  author's own proposals, unless you name the missing amortization argument.

  PHASE 4: at most three new directions, ordered by expected value, each naming
  the Phase-2 gap it exploits and the first lemma to prove. Label every
  mathematical claim VERIFIED, CHECKED-SMALL (you ran a computation on small
  cases), or CONJECTURE. Never present a conjecture as a theorem.

  PHASE 5 (at most 15% of the report): stale statuses, index rows contradicting
  node files, broken links, undefined first uses in ACTIVE nodes. Respect the file
  structure in INITIAL_PROMPT.md; do not propose new files or renamed folders.

  FORMAT. Begin with a ten-line executive summary. Then include a section headed
  "## Verdicts" with one line per ACTIVE node in exactly this form:
  VERDICT A019: STOP — one-line reason
  a section headed "## Directions" with lines in exactly this form:
  DIRECTION 1: one-line direction — first lemma to prove
  and a section headed "## Premise gaps" with lines in exactly this form:
  PREMISE: one-line statement of an unexamined assumption or an existence lemma
  used only as an obstacle
  The controller parses these lines into the digest the author reads first; keep
  them one line each. Then the phases, in order.

solver_prompt: |-
  You are a solver, not a reviewer. Your working directory contains only
  STATEMENT.md (the exact task) and BRIEF.md (the author's current PLAN and the
  statements of the lemmas on its best route, without proofs). Read both. Do not
  assume the brief's framing is right. Answer in order, in at most 1,500 words:
  1. What is the WEAKEST object the brief's proved lemmas actually consume (quote
     the lemma)? Is the brief's MISSING step stronger than that? If so, restate
     the missing step for the weakest object.
  2. For every existence theorem in the brief, name the auxiliary flow, LP, or
     transportation problem whose feasibility it certifies, on which network, and
     what one computation of that problem yields.
  3. Give a complete candidate algorithm for the missing step using only these
     primitives unless you show they cannot suffice: one exact max-flow or
     min-cost flow per step, expectation-preserving rounding, an averaged or lazy
     step inside a polytope, a classical decomposition theorem, a single
     maintained sample updated polylogarithmically many times. State its per-step
     guarantee as an inequality on conditional expectations, and its number of
     steps.
  4. List every gap in your candidate honestly, ranked; mark each VERIFIED,
     CHECKED-SMALL, or CONJECTURE.
  Begin your answer with a section headed "## Directions" containing one line per
  candidate in exactly this form:
  DIRECTION 1: one-line summary of the candidate algorithm — first lemma to prove
  Do not write records. Return the text to the controller.
