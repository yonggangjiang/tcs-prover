# Optional research audits during an author pause. Edit audit instructions here.
defaults:
  intervalHours: 2
  models: [none, none, none]

# Model IDs and maximum supported reasoning effort belong here, not in Python.
# Refresh explicit IDs when providers release stronger models.
models:
  - {value: none, label: None}
  - {value: gpt-6-astra, label: GPT Astra (Ultra), provider: codex, model: gpt-6-astra, effort: ultra}
  - {value: gpt-5.6-sol, label: GPT Sol (Ultra), provider: codex, model: gpt-5.6-sol, effort: ultra}
  - {value: gpt-5.6-terra, label: GPT Terra (Ultra), provider: codex, model: gpt-5.6-terra, effort: ultra}
  - {value: gpt-5.6-luna, label: GPT Luna (Max), provider: codex, model: gpt-5.6-luna, effort: max}
  - {value: claude-fable, label: Claude Fable 5.1 (Max), provider: claude, model: claude-fable-5-1, effort: max}
  - {value: claude-opus, label: Claude Opus (Max), provider: claude, model: opus, effort: max}
  - {value: claude-sonnet, label: Claude Sonnet (Max), provider: claude, model: sonnet, effort: max}
  - {value: claude-haiku, label: Claude Haiku, provider: claude, model: haiku}
  - {value: kimi-k3, label: Kimi K3 (Max), provider: kimi, model: kimi-code/k3, effort: max}
  - {value: kimi-code, label: Kimi Code (Max), provider: kimi, model: kimi-code/kimi-for-coding, effort: max}

# Auditors read the paused author's actual workspace; no research copy is made.
# Before a batch starts, move previous reports from output into history.
output: AUDITS
history: audit_history

# EDIT AUDIT PROMPT HERE: advice only; the author owns research file management.
prompt: |-
  You are an independent research adviser reviewing a saved research trajectory.
  You are working directly in the paused author's workspace with read-only tools.
  Do not edit any files or delegate the audit. Form your own assessment of the
  research records; do not read AUDITS/ or audit_history/ or rely on peer reports.
  The controller has moved previous reports to audit_history/ and will save your
  final Markdown response into AUDITS/. Only the controller manages these folders.
  The original task for the research is in INITIAL_PROMPT.md, and the author has saved their work in APPROACHES.md, APPROACHES/**/*.md that record their approaches, and PROVED.md that records their proven results. Your audit has two goals:

  1. Help the author make progress toward proving the exact mathematical statement
  more efficiently and with a greater chance of success. Propose new approaches and directions that are likely to advance the research. after thinking about the original goal thoroughly to diversify the approaches. Identify what matters most in the current trajectory: promising ideas, useful lemmas, decisive gaps, bottlenecks, and work that is unlikely to advance the goal, eppecially if the author is circulating in an non-promising cycle or deep into a non-promising path. Critically examine the author's approaches and lemmas where
  their correctness or usefulness affects progress.

  2. Audit the content of the saved research files for their readability for a human. Suggest improvements to contents, links, summaries, and explanations that make the work easier to retrieve, understand, and continue without losing substantive mathematical detail. However, you should respect the general file structure stated in INITIAL_PROMPT.md, and avoid suggestions that would create new files or change the current file names and structure. Importantly, make sure all the contents are human-readable: assume the reader is a human with only general TCS background and only know the intial statment, and may jump into one part of the research note, the contents should define every term and notation under this reader background, and any context help the reader know how this node connects to the literature in this feild, other nodes and the overal research goal. Try to identify places in a file where the reader may be confused or lost under only the context of that file before that sentence and the original statement, and suggest improvements to make the contents self-contained and readable. 

  Once you have completed your review, return a clear Markdown report.
