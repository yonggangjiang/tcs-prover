nodes:
  latex_editor:
    run: structured
    workflow_stage: writing
    skip: end
    role: writer
    stage: final
    prompt: solution_input
    instructions: final
    inputs:
      statement: "get(state, 'statement', '')"
      solution: "get(state, 'solution', get(state, 'source', ''))"
    edit: {file: latex-source.tex, field: latex}
    response: {summary: string}
    require: ["strip(result.latex) != ''", "latex_intact(result.latex, get(state, 'solution', get(state, 'source', '')))"]
    after:
      - set: {output: result.latex, edited_latex: result.latex}
    next: latex_compile

  latex_compile:
    run: command
    workflow_stage: writing
    skip: end
    stage: final
    before:
      - write: {path: latex-source.tex, text: state.output}
    command:
      argv: [latexmk, -norc, -pdf, -g, -interaction=nonstopmode, -file-line-error, -no-shell-escape, -jobname=final, latex-source.tex]
      requires: [pdflatex]
      env: {openin_any: p, openout_any: p}
      timeout: 300
      produces: [final.pdf]
      log: latex-compile.log
      result: compilation
    outcome: result.status
    next:
      pass:
        to: end
        after:
          - write: {path: final.tex, text: state.output}
          - emit: {kind: final_result, label: Compiled LaTeX document and PDF, text: '=state.output', output: '=state.output'}
      fail:
        to: latex_repair
        after:
          - emit: {kind: diagnostic, label: Fixing LaTeX compilation, text: '=result.diagnostic'}
      uncompiled:
        to: end
        after:
          - write: {path: final.tex, text: state.output}
          - emit: {kind: diagnostic, label: PDF not compiled, text: '=result.diagnostic'}
          - emit: {kind: final_result, label: LaTeX document without a compiled PDF, text: '=state.output', output: '=state.output'}

  latex_repair:
    run: structured
    workflow_stage: writing
    skip: end
    role: writer
    stage: final
    prompt: {when: "get(state.compilation, 'timed_out', False)", then: compilation_timeout, else: compilation_repair}
    inputs:
      latex: state.output
      diagnostic: state.compilation.diagnostic
      compiler_output: state.compilation.output
    edit: {file: latex-source.tex, field: latex, input: latex}
    response: {summary: string}
    require: ["strip(result.latex) != ''", "latex_kept(result.latex, get(state, 'edited_latex', ''))"]
    after:
      - set: {output: result.latex}
    next: latex_compile

prompts:
  # EDIT LATEX REPAIR HERE: sent when the paper does not compile: {diagnostic} and {compiler_output}
  # (also {latex} and {instructions}).
  compilation_repair: |-
    Fix only the LaTeX compilation errors shown below. Make the smallest necessary
    changes to fix the bugs and do not change any content.

    COMPILER DIAGNOSTIC:
    {diagnostic}

    COMPILER OUTPUT:
    {compiler_output}
  # EDIT LATEX TIMEOUT HERE: sent when the paper's compilation does not finish: {diagnostic} and
  # {compiler_output} (also {latex} and {instructions}).
  compilation_timeout: |-
    The LaTeX compilation below did not finish. Check the source for an infinite loop or
    a runaway computation and fix it with the smallest necessary changes; do not change
    any content.

    COMPILER DIAGNOSTIC:
    {diagnostic}

    COMPILER OUTPUT:
    {compiler_output}
  # EDIT WRITER HERE: the instructions of the paper writer (Writing step). Used as written.
  final: |-
    Act as the TCS editor and turn the solution below into a LaTeX paper for a strong reader in the area
    who does not know this argument. Clarity is the goal, not length. Preserve the main theorem's exact
    hypotheses, quantifiers, conclusions and scope; connective prose must not change what is claimed.
    Remove repetition and process commentary, and write a self-contained, rigorous and readable paper in
    the tree-like structure of a well-written TCS paper, ordered by dependency:
    (1) State the problem and the main theorem early, then give a self-contained technical overview: the
    main obstruction, the central mechanism, and how the stages fit together.
    (2) Begin each section and subsection with what it proves and why the main theorem needs it. Use a
    lemma when a result is reused or isolates an idea, and place supporting results near their uses.
    (3) Before each definition, construction or parameter choice, say what it is for and how it will be
    used; state the idea before the calculation.
    (4) For algorithmic tasks, separate the algorithm, its correctness proof and its complexity analysis.
    (5) Follow the terminology and notation of previous works. Use one symbol per object, introduce it
    before its first use, and add no symbol or abbreviation that does not earn its place.
    (6) Expand ambiguous or underspecified details and explain every non-trivial step; never let
    "clearly", "standard" or "similarly" stand in for an argument.
    (7) Credit known results and techniques at their first use and say exactly what is new; never invent
    a reference.

    Then refactor the manuscript at the level of mathematical dependencies. Seek substantial
    simplifications of lemma contracts and algorithmic interfaces, including changes to constructions
    where useful. For each major construction, first inspect all its downstream uses and identify exactly
    which properties they require, then look for a simpler existential or algorithmic lemma exposing those
    properties. Keep construction rules and their auxiliary notation inside the smallest scope that needs
    them (proof, subsection, section). Identify and implement the strongest justified improvements
    yourself. Verify the mathematical guarantees and running-time analysis, update every consumer, and
    repeat the dependency audit.

    Finally, reread the whole paper as a skeptical first-time reader, repair what you find, and repeat
    until a full pass changes nothing. If a gap cannot be closed, keep it visible rather than presenting
    the proof as complete. Give the bibliography as an inline thebibliography environment; no .bib file
    or bibliography program is available. The final document must be complete LaTeX that compiles
    without errors. Return only the requested JSON.
  # EDIT WRITER REQUEST HERE: frames the writer's request: {instructions}, {statement} and {solution}.
  solution_input: |-
    {instructions}

    EXACT STATEMENT (when supplied):
    {statement}

    SOLUTION:
    {solution}
