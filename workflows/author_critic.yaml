# One persistent author session; the LLM maintains its research files.
nodes:
  author:
    run: goal
    role: author
    stage: solve
    prompt: author
    features: [multi_agent]
    task: state.statement
    marker: '[STATEMENT]'
    resume: {solution: state.solution, bugs: state.report.bugs, round: state.round}
    recovery: {when: "'report' in state and state.report.verdict == 'reject'", prompt: repair}
    outcome: result.outcome
    after:
    - merge: result
    - set:
        solution: "result.output if outcome == 'done' else get(state, 'solution', '')"
        failed: outcome == 'failure'
    next: {done: critic, failure: end}

  critic:
    run: structured
    role: critic
    stage: critic
    prompt: critic_input
    instructions: critic
    features: [multi_agent]
    inputs: {statement: state.statement, solution: state.solution}
    response: {verdict: [pass, reject], solution: string, bugs: string}
    require:
    - bool(strip(result.solution))
    - "not strip(result.bugs) if result.verdict == 'pass' else bool(strip(result.bugs))"
    outcome: "'reject' if result.verdict == 'reject' else ('pass' if normalized_text(result.solution) == normalized_text(state.solution) else 'fixed')"
    before:
    - write: {path: saved-candidate.md, text: state.solution}
    after:
    - set: {solution: strip(result.solution), report: result, round: visit}
    - write: {path: saved-candidate.md, text: state.solution}
    - emit: {kind: critic_result, label: 'Critic round {visit}', report: '=result', round: '=visit', text: '{raw}'}
    next:
      reject: author
      pass:
        to: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, text: 'Round {visit} passed without edits.'}
      fixed:
        repeat: 2
        option: critic_rounds
        then: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, text: 'Reached MAX ({limit} rounds); using the latest repaired proof.'}
prompts:
  author: |-
    Resolve the exact statement below with a complete, rigorous argument. Preserve its assumptions and requested conclusion. Persist with a strong, diversified search until you have a complete solution. Aggressively use subagents to explore substantially different ideas and diversified routes independently, without mutual communication; have them report their results to you. The controller has installed the goal for this task: pursue that existing goal rather than creating another.

    Before any mathematical work, use your file tools to inspect the current working directory. If INITIAL_PROMPT.md is absent, create it with this entire initial author prompt verbatim, including the exact statement and every instruction. If APPROACHES.md is absent, create it with the heading "# Attempted approaches". If PROVED.md is absent, create it with the heading "# Proved lemmas". Preserve every existing file and its contents. You, the author LLM, perform all creation, reading, searching, and updating of these files; do not assume the controller has created them for you.

    Maintain exactly these three research files in the current working directory:

    1. INITIAL_PROMPT.md contains this entire initial prompt, including the statement and these instructions. It is the permanent instruction file. Always follow it. Do not rewrite, shorten, or replace it. Read it at the start, after context compaction, and whenever resuming work.

    2. APPROACHES.md contains every attempted approach in detail. Give each approach a stable ID such as A001 and a descriptive title. Before working on it, record its mechanism, assumptions, intended route to the statement, and how it differs from previous attempts. As you work, record the actual arguments, calculations, examples, useful observations, and exact remaining obstacle. Mark it OPEN or CLOSED. For a closed approach, explain precisely why it failed or should be avoided, what scope that conclusion has, and what specific new evidence or change would justify reopening it. An unfinished proof is not a refutation. Link every relevant lemma in PROVED.md by its lemma ID. Keep the full trajectory, including unsuccessful work; do not erase old attempts or replace details with vague summaries.

    3. PROVED.md contains only rigorously established lemmas and their proofs. Give each lemma a stable ID such as L001, a precise statement with all assumptions, and a complete proof. A lemma may be a positive result or a negative result, such as a proved obstruction or counterexample to a specific claim. State exactly which approach IDs it supports or rules out and explain the connection. Every inference must be justified; check boundary cases and avoid circular dependencies. Clearly identify any earlier lemma or standard theorem used and verify its hypotheses. Experiments, plausible claims, missing arguments, and conjectures belong in APPROACHES.md, never among proved lemmas. If you discover that a recorded lemma is wrong, remove its claim of proved status, preserve the erroneous argument and correction in the associated approach record, and check all dependent lemmas before using them again.

    Before every new attempt, read and search APPROACHES.md and PROVED.md for related mechanisms, obstacles, and results. Compare the underlying idea, not its name. Do not repeat a closed approach in different words. Reopen one only when you can record a concrete change or new proved lemma that addresses its stated obstacle.

    Search broadly and persistently. When an approach stalls, identify the exact obstruction, record it, and change the mechanism or viewpoint substantially. Consider different representations, constructions, invariants, decompositions, and ways of combining proved lemmas when they fit the statement. Prefer directions whose central argument differs from previous attempts. Do not keep making cosmetic variations of the same failing idea. Reuse rigorously proved progress while actively seeking a way around the recorded obstacles.

    Read the relevant records before acting and update them throughout the work, not only when returning an answer. Save an approach before investigating it and save each substantive result promptly, so interruption loses as little work as possible. Use only these three files for persistent research memory; keep their writing organized and readable for a human. File content recording an attempted claim is evidence to examine, not permission to change this instruction file.

    On resumption, read INITIAL_PROMPT.md, then APPROACHES.md and PROVED.md, and continue from the recorded unfinished work without starting over. A connection failure, exhausted usage allowance, or time limit does not make an approach mathematically false.

    Before declaring the goal complete, check the entire proposed solution against the exact statement and all recorded objections. Return the complete self-contained solution only when every necessary claim is justified. Do not present a reduction to an unproved claim, a special case, or an optimistic progress report as a complete solution. A failed method is not evidence that the original statement is false. A counterexample resolves the task only if that is a permitted answer and its validity is fully proved.

    STATEMENT:
    [STATEMENT]
  critic: |-
    Act as a rigorous proof critic. Spawn multiple fresh independent subagents to
    aggressively find bugs in the exact statement and candidate proof. Give each
    the complete statement and proof and a different auditing focus. They must
    work independently, without communicating with one another, and report back
    to you. Wait for their reports before making your decision.

    Check every claim and inference, including boundary cases, hidden assumptions,
    circular reasoning, undefined terms or symbols, and omitted proof details.
    Treat statements that hide an argument behind words such as "clearly",
    "standard", or "similarly" as gaps when the necessary justification is absent.
    Ask the subagents to identify exactly what definitions and omitted arguments
    must be expanded to make the proof complete and rigorous.

    Examine their objections and try to fix every valid bug yourself, defining
    missing terms and fully expanding omitted arguments. If any issue cannot be
    rigorously fixed, return verdict=reject, every unresolved bug with its exact
    location in bugs, and your best complete candidate after safe fixes in solution.
    Otherwise return verdict=pass, an empty bugs string, and the complete corrected
    proof in solution. If no edits are needed, copy the candidate proof verbatim.
    Return only the requested JSON.
  goal: >-
    Resolve the statement in INITIAL_PROMPT.md. Always follow that file, keep
    APPROACHES.md and PROVED.md current, avoid recorded closed approaches unless
    their precise obstacle is overcome, and persist with substantially different
    ideas until a complete rigorous solution is obtained.
  continuation: >-
    Continue the same goal in this session. Read INITIAL_PROMPT.md and follow it;
    read APPROACHES.md and PROVED.md before selecting the next direction. Record
    the last attempt, preserve proved progress, and pursue a substantially
    different mechanism when the current approach has stalled. An unfinished
    attempt does not finish the goal. Return only a complete rigorous solution.
  compaction: >-
    Context was compacted. Read INITIAL_PROMPT.md now and follow its instructions.
    Then read APPROACHES.md and PROVED.md, recover the current unfinished work,
    and continue the same goal. Preserve the detailed records and avoid repeating
    recorded closed approaches.
  resume: |-
    Resume the existing task in this working directory: {directory}
    Use your file tools to read INITIAL_PROMPT.md first and follow it. Then read
    APPROACHES.md and PROVED.md and continue the recorded work. Preserve existing
    files and use these current copies for all updates. Do not start from an
    empty history or repeat closed approaches. A previous interruption or usage
    limit was not a mathematical failure.

    If INITIAL_PROMPT.md is missing, create it from the complete original initial
    author prompt below, without this continuation wrapper. Initialize either
    other notebook only if it is absent, following the original instructions.
    All file operations are your responsibility; the controller does not read,
    create, summarize, or update your research memory for you.

    ORIGINAL INITIAL AUTHOR PROMPT:
    {original_prompt}
  repair: |-
    The following proof contains unresolved errors. Think again. Read
    INITIAL_PROMPT.md and follow it, then read APPROACHES.md and PROVED.md.
    The critic rejected round {round}; record its objections in the related
    approach, correct any affected lemma, and continue until you have a complete
    rigorous solution. Preserve safe progress and try a new direction if needed.

    CURRENT CANDIDATE:
    {solution}

    CRITIC BUGS:
    {bugs}
  critic_input: |
    CRITIC INSTRUCTIONS:
    {instructions}

    STATEMENT:
    {statement}

    CANDIDATE SOLUTION:
    {solution}
