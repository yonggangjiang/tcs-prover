# One persistent author session for proving the exact statement.
nodes:
  author:
    run: goal
    role: author
    stage: solve
    prompt: author
    lifecycle: [goal, continuation, compaction, repair, resume]
    features: [multi_agent]
    task: state.statement
    marker: '[STATEMENT]'
    resume: {solution: state.solution, bugs: state.report.bugs, round: state.round}
    recovery: {when: "'report' in state and state.report.verdict == 'reject'", prompt: repair}
    outcome: result.outcome
    after:
    - merge: result
    - set:
        solution: "result.output if outcome == 'done' else get(state, 'solution', '')"
        failed: outcome == 'failure'
    next: {done: critic, failure: end}

  critic:
    run: structured
    role: critic
    stage: critic
    prompt: critic_input
    instructions: critic
    features: [multi_agent]
    inputs: {statement: state.statement, solution: state.solution}
    proof_handoff: {candidate: solution, statement: statement}
    response: {verdict: [pass, reject], solution: string, bugs: string}
    require:
    - bool(strip(result.solution))
    - "not strip(result.bugs) if result.verdict == 'pass' else bool(strip(result.bugs))"
    outcome: "'reject' if result.verdict == 'reject' else ('pass' if normalized_text(result.solution) == normalized_text(state.solution) else 'fixed')"
    before:
    - write: {path: saved-candidate.md, text: state.solution}
    after:
    - set: {solution: strip(result.solution), report: result, round: visit}
    - write: {path: saved-candidate.md, text: state.solution}
    - emit: {kind: critic_result, label: 'Critic round {visit}', report: '=result', round: '=visit', outcome: '=outcome', text: '{raw}'}
    next:
      reject: author
      pass:
        to: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, acceptanceReason: clean_pass, round: '=visit', text: 'Round {visit} passed without edits.'}
      fixed:
        repeat: 2
        option: critic_rounds
        then: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, acceptanceReason: round_limit, round: '=visit', roundLimit: '=limit', text: 'Reached MAX ({limit} rounds); using the latest repaired proof.'}
prompts:
  # EDIT AUTHOR HERE: instructions for proving the exact statement.
  author: |-
    The following is the statement to prove. Try to prove it with a complete, rigorous argument.

    On macOS or Linux, when complete, write the entire self-contained proof to
    proof.md in your working directory and submit exactly PROOF_FILE: proof.md
    as your final response. Include every argument needed by the critic in that
    file. The critic receives a read-only snapshot of this file and the exact
    statement. After a rejection, update proof.md with the revised complete
    proof and submit it again. A complete inline proof is also accepted.
    On Windows, return the entire self-contained proof inline in your final
    response, including after a rejection; do not submit a file pointer.

    STATEMENT:
    [STATEMENT]
  goal: >-
    Prove the exact statement given in the initial prompt with a complete, rigorous argument.
  continuation: >-
    Continue trying to prove the same statement in this conversation. Return a
    complete, rigorous solution only when the exact statement is resolved.
  compaction: >-
    Continue the same proof task using the conversation summary. Preserve the
    exact assumptions and requested conclusion.
  resume: |-
    Continue trying to prove the statement below, using any previous work in this conversation.
    If independent reports are present in AUDITS/, consider their advice before continuing.

    ORIGINAL AUTHOR PROMPT:
    {original_prompt}
  repair: |-
    Correct the unresolved errors in this candidate and continue proving the exact statement.

    CURRENT CANDIDATE:
    {solution}

    CRITIC BUGS:
    {bugs}

  critic: |-
    Act as a rigorous proof critic. Spawn multiple fresh independent subagents to
    aggressively find bugs in the exact statement and candidate proof. Give each
    the complete statement and proof and a different auditing focus. They must
    work independently, without communicating with one another, and report back
    to you. Wait for their reports before making your decision.

    Check every claim and inference, including boundary cases, hidden assumptions,
    circular reasoning, undefined terms or symbols, and omitted proof details.
    Treat statements that hide an argument behind words such as "clearly",
    "standard", or "similarly" as gaps when the necessary justification is absent.
    Ask the subagents to identify exactly what definitions and omitted arguments
    must be expanded to make the proof complete and rigorous.

    Examine their objections and try to fix every valid bug yourself, defining
    missing terms and fully expanding omitted arguments. If any issue cannot be
    rigorously fixed, return verdict=reject, every unresolved bug with its exact
    location in bugs, and your best complete candidate after safe fixes in solution.
    Otherwise return verdict=pass, an empty bugs string, and the complete corrected
    proof in solution. If no edits are needed, copy the candidate proof verbatim.
    Return only the requested JSON.

  critic_input: |
    CRITIC INSTRUCTIONS:
    {instructions}

    STATEMENT:
    {statement}

    CANDIDATE SOLUTION:
    {solution}
