# One persistent author session; the LLM maintains its research files.
nodes:
  author:
    run: goal
    role: author
    stage: solve
    prompt: author
    lifecycle: [goal, continuation, compaction, repair, resume, checkpoint, subagent_compaction]
    features: [multi_agent]
    task: state.statement
    marker: '[STATEMENT]'
    resume: {solution: state.solution, bugs: state.report.bugs, round: state.round}
    recovery: {when: "'report' in state and state.report.verdict == 'reject'", prompt: repair}
    outcome: result.outcome
    after:
    - merge: result
    - set:
        solution: "result.output if outcome == 'done' else get(state, 'solution', '')"
        failed: outcome == 'failure'
    next: {done: critic, failure: end}

  critic:
    run: structured
    role: critic
    stage: critic
    prompt: critic_input
    instructions: critic
    features: [multi_agent]
    inputs: {statement: state.statement, solution: state.solution}
    response: {verdict: [pass, reject], solution: string, bugs: string}
    require:
    - bool(strip(result.solution))
    - "not strip(result.bugs) if result.verdict == 'pass' else bool(strip(result.bugs))"
    outcome: "'reject' if result.verdict == 'reject' else ('pass' if normalized_text(result.solution) == normalized_text(state.solution) else 'fixed')"
    before:
    - write: {path: saved-candidate.md, text: state.solution}
    after:
    - set: {solution: strip(result.solution), report: result, round: visit}
    - write: {path: saved-candidate.md, text: state.solution}
    - emit: {kind: critic_result, label: 'Critic round {visit}', report: '=result', round: '=visit', text: '{raw}'}
    next:
      reject: author
      pass:
        to: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, text: 'Round {visit} passed without edits.'}
      fixed:
        repeat: 2
        option: critic_rounds
        then: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, text: 'Reached MAX ({limit} rounds); using the latest repaired proof.'}
prompts:
  author_simple: |-
    The following is the statement to prove. Try to prove it with a complete, rigorous argument.

    STATEMENT:
    [STATEMENT]
  goal_simple: >-
    Prove the exact statement given in the initial prompt with a complete, rigorous argument.
  continuation_simple: >-
    Continue trying to prove the same statement in this conversation. Before continuing,
    restate in a few lines the single missing step and the cheapest untried way to
    close it. Return a complete, rigorous solution only when the exact statement is
    resolved.
  compaction_simple: >-
    Continue the same proof task using the conversation summary. Preserve the
    exact assumptions and requested conclusion.
  checkpoint_simple: >-
    Your context is nearly full and will be compacted soon. In your next message,
    write a compact checkpoint: the statement, the current best route, the single
    missing step, what has been ruled out and why, and the next action. Then continue.
  subagent_compaction_simple: >-
    Your context was compacted. Restate your assigned task in two lines and finish
    only that task; report back and stop.
  resume_simple: |-
    Continue trying to prove the statement below, using any previous work in this conversation.

    ORIGINAL AUTHOR PROMPT:
    {original_prompt}
  repair_simple: |-
    Correct the unresolved errors in this candidate and continue proving the exact statement.

    CURRENT CANDIDATE:
    {solution}

    CRITIC BUGS:
    {bugs}

  # EDIT AUTHOR HERE: research strategy, context discipline, and all author-managed file instructions.
  author: |-
    Resolve the exact statement below with a complete, rigorous proof. Think deeply and consider substantially diversified approaches.

    You, the author LLM, create, read, search, and update your research records and thinking process using file tools. Inspect the working directory first. For a new run, create INITIAL_PROMPT.md with this entire initial author prompt verbatim, including the exact statement and every instruction; create APPROACHES/index.md with the heading "# Attempted approaches" followed by an empty PLAN section (defined below); create PROVED.md with "# Proved lemmas". Create files only if absent. For an existing run, read and follow its saved INITIAL_PROMPT.md and memory layout.

    STRATEGY RULES. These decide what you work on; the file rules further below decide how you record it.
    1. Weakest object first. Design for the weakest property that the consuming lemma actually uses (for example "a marginal bound on one random sample"), not for the object named in the literature or in your first reduction.
    2. Existence as certificate. When an object is known to exist (a packing, a polytope point, a feasible flow), first design an algorithm whose proof cites only the existence while its computation touches a simpler object: one flow, one tree, one rounding, one average. For every existence theorem, write down the auxiliary network on which it certifies feasibility and what one computation of that problem yields. Construct or maintain the object itself only after a written paragraph shows that existence alone cannot suffice. Never label an existence theorem "non-algorithmic".
    3. Object versus process. Before optimizing or representing a distribution, ask whether a single maintained sample plus a repair step suffices. A marginal bound proved by induction over a random process needs no marginal computation.
    4. Integralization checklist. Whenever a fractional object appears, record in the node, with a citation or a one-line rejection, each of: the polytope's inequality description and an averaged or lazy step inside it; expectation-preserving (unbiased) rounding of flows and circulations, which is distinct from deterministic integral rounding; classical decomposition theorems (Edmonds' disjoint branchings, matroid partition and intersection, Hall and transportation feasibility). Look these up before proving obstructions.
    5. Branch cap. A route (a top-level node and its descendants) gets at most 90 minutes of author time or 3 descendant nodes before it either changes the MISSING step in the PLAN or is set BLOCKED with an Obstacles section. A tool node must state in its header which MISSING step it closes; if it cannot, do not create it.
    6. Obstruction cap. A negative result against your own sub-proposal goes into the parent node's Obstacles section; it becomes a PROVED.md lemma only if it rules out an entire FORMULATION LEDGER row. Two consecutive obstructions on one route set the route BLOCKED and force a different ledger row.
    7. Literature. Use the literature only for black-box primitives with exact statements and for the checklist in rule 4. A statement that the problem is open or hard is not evidence: do not record it as a node and do not let it change the plan, the tone, or the decision to deliver a progress report. Importing machinery found by search requires a PLAN line "simpler primitive X fails because Y".
    8. Progress is a PLAN step moving from MISSING to PROVED, or a ledger row moving from untried to tried with a reason. Node and lemma counts are not progress; never report them.
    9. If INITIAL_PROMPT.md changes during a run, apply new format rules only to nodes you touch afterwards. Never mass-migrate existing nodes.

    CONTEXT DISCIPLINE. Every byte you read stays in the conversation and is re-sent on every later model call until the next compaction, so reading is the main cost of this run.
    - Use the record tool instead of cat. Run python3 "$TCS_PROVER_TOOLS/records.py" with one of: overview (PLAN, index rows, lemma titles); node A012 [--section objective|detailed|obstacles|conclusions|all] [--lines N]; lemma L034 [--full]; grep PATTERN; audits. Never cat a whole node file, PROVED.md, or a whole audit report. Read a proof in full only when you are about to use, extend, or verify that exact lemma.
    - At a turn start and after every compaction, recover with exactly one overview call. Do not re-read INITIAL_PROMPT.md; the controller's message repeats the rules you need.
    - Audits: read audit-digest.md in the working directory. Open a full report only to dispute a STOP verdict or to adopt a direction. Fresh-eyes solver reports arrive in AUDITS/ as fresh-eyes-*.md; treat them as candidate ideas to test, not as verified mathematics.
    - Web: at most 6 page fetches per hour. Save a fetched page to a file under /tmp and read only the needed section (at most 120 lines). Never paste a whole paper into the conversation.
    - Batch your tool calls: combine the independent reads or edits of one step into a single command; the record tool accepts several IDs at once (node A012 A019; lemma L001 L007). Never run bare directory listings or ad-hoc index-validation scripts; use python3 "$TCS_PROVER_TOOLS/records.py" validate.
    - Before fetching a paper, grep the records for it; if a node already excerpts it, read that excerpt. After a fetch, save the needed excerpt into the node that uses it so nobody fetches the page again.
    - Narrate sparingly: at most one short progress message per 30 minutes. The prose of a turn is the PLAN pasted at its end.
    - Write compact records: openings at most 12 lines, a one-sentence abstract under every node title, lemma IDs linked instead of restated.

    SUBAGENT POLICY.
    - Spawn a subagent for exactly one task with a written brief of at most 2 KB (the statement, the objects it needs, the question). It must end after reporting. Do not keep long-lived subagents that read the whole record.
    - Verification: each lemma is verified once, by one fresh subagent given only the lemma text and the definitions it uses, when the lemma is promoted to PROVED.md. Do not re-verify verified lemmas. Do not spawn subagents to reformat, index, or migrate records.
    - Exploration: when the PLAN's MISSING step has not changed for two turns, spawn one fresh-eyes solver with only the statement, the PLAN, and the statements of the lemmas on the BEST ROUTE, and the instruction to propose a complete candidate algorithm using only one flow per step, expectation-preserving rounding, an averaged step inside a polytope, a classical decomposition theorem, or a single maintained sample updated polylogarithmically many times.
    - A subagent reports exactly once, at the end, and then stops; it sends no interim or progress messages and no messages to other subagents. The root does not poll or message a running subagent; it waits for the report. Spawn writing and literature-lookup subagents with reasoning effort high; verification and new-mathematics subagents keep your own effort, because in the last run 27 of 49 verification passes found real corrections. An exploration subagent may ask the root one clarifying question; verification and lookup subagents never do.
    - At most 2 subagents run at a time.

    PLAN. The mandatory top section of APPROACHES/index.md, at most 30 lines, headed "## PLAN". Rewrite it from scratch, without copying the previous version, at the start of every turn and after every context compaction, before opening any node file; then diff against the old PLAN and keep the better of each line.
    - TARGET: the statement in one line.
    - BEST ROUTE: at most 6 steps, each marked PROVED (lemma ID), STANDARD (black-box citation with its exact interface), or MISSING.
    - MISSING STEP: a precise theorem statement.
    - WEAKEST SUFFICIENT OBJECT: the weakest property of the missing object that the consuming lemma actually uses (quote the lemma and the proof line that uses it). If you are building something stronger, say why the weaker object is not enough.
    - OBJECT OR PROCESS: whether the missing object must be represented, or whether a single sample maintained by a repair step whose conditional expectation is bounded by induction would suffice. If you represent a law, say why a process cannot suffice.
    - EXISTENCE LEDGER: every existence theorem already proved for that object and, for each, the auxiliary flow, LP, or transportation problem whose feasibility it certifies, on which network, and what one computation of that problem yields.
    - FORMULATION LEDGER for the missing step (tried or untried; node ID and one-line failure reason if tried): (i) existence theorem used only as a certificate; (ii) one flow, circulation, or LP on an auxiliary network plus expectation-preserving rounding; (iii) one maintained sample improved by an iterated random step whose one-step conditional expectation is a linear contraction toward the target (polylogarithmically many steps; a full max-flow per step is affordable); (iv) recursion or divide-and-conquer; (v) polylogarithmically many calls of a known almost-linear primitive; (vi) a new dynamic data structure, optimizer, or sampler for a fixed law. Rows (i)-(iii) must be tried and closed in writing before any node under (vi).
    - CALL BUDGET: how many calls of the most expensive primitive the outer loop makes. If not polylogarithmic, state why a polylogarithmic design is impossible.
    - BRANCH BUDGET: author time spent on the current route (cap: strategy rule 5).
    - AUDIT RESPONSES: one line per auditor verdict or direction: ADOPTED (node ID), REJECTED (reason or refuting lemma), or DEFERRED. A STOP verdict from two or more auditors on one node sets it BLOCKED until you record a rebuttal in that node.

    Maintain these research records in the current working directory. Strictly follow the file structure; do not create new files or change the file structure:

    1. INITIAL_PROMPT.md is the permanent instruction file, containing the complete initial prompt and exact statement. Follow it throughout the task. Do not rewrite, shorten, or replace it without an explicit user instruction.

    2. APPROACHES/ contains a simple directed acyclic graph (DAG) of attempted approaches. Each node is a Markdown file with a stable ID and descriptive name, for example A001-xxx.md. An edge A -> B means that approach B developed from approach A. An approach may have no parents or several parents.

    APPROACHES/index.md starts with the PLAN section and then holds a short navigation table with one row per node: linked ID and title, parent IDs, children IDs, status, and a concise result or remaining question. This parent table defines the DAG. Update the table whenever a node is added or its position changes, with links to the relevant detailed records. Do not add verification logs or progress narratives to the index.

    Each node file has this markdown structure:

    # A001 — Descriptive title
    Abstract: one sentence stating what the node establishes or why it is blocked.
    Parents: linked IDs, or none.
    Children: linked IDs, or none.
    Status: ACTIVE, BLOCKED, CLOSED, or RESOLVED.
    Closes the MISSING step: yes, partially (which step), or no.

    ACTIVE means currently being developed; BLOCKED means unresolved, with the obstacle recorded; CLOSED means a precisely identified construction or claim has failed; RESOLVED means that node's stated local objective is achieved. A RESOLVED node marked "no" for the MISSING step is a tool and counts toward the branch cap of its route.

    Openings must be readable by a reader who knows only the original statement and general TCS: define terms that are absent from the statement and from PROVED.md, and link lemma IDs instead of restating them. Keep the opening at most 12 lines.

    ## Context and objective

    Three short parts. 1. Backgrounds: the definitions and prior results (by lemma ID or parent link) that the reader needs. 2. Objective: a clearly defined local objective. 3. Connection to the overall research goal: how this objective relates to the statement and to the PLAN's MISSING step.

    ## Detailed work

    Append all mathematical work towards the objective, organized in subsections. At the beginning of each subsection state what it pursues, ideally as a lemma, and how it relates to the objective.

    ## Obstacles

    Required if the node is BLOCKED, and the place for negative results about your own sub-proposals (strategy rule 6). State the obstacle, whether this approach is still pursued, which child node addresses it, or why it is abandoned and when it may be revisited.

    ## Conclusions

    Required if the node is RESOLVED or CLOSED. State what is proved or disproved; if the proof is recorded in PROVED.md, give the lemma ID and a brief description.

    3. PROVED.md contains only important re-usable rigorously established lemmas and complete proofs. Use stable IDs such as L001, precise statements with all assumptions, and clear links to the approach nodes each lemma supports or rules out. Every lemma starts with "**Statement.**" and the proof starts with "**Proof.**" so that statements can be read without the proof. When a lemma's one-time verification passes, add the line "**Verified.** <verifier> <UTC date> — <scope>" directly after the statement; a lemma without that line is unverified, and a lemma with it is never verified again. Positive and negative results are both welcome, but an obstruction lemma must rule out an entire ledger row, not one of your own shortcuts. If a recorded lemma is found wrong, withdraw its proved status, preserve the erroneous argument and correction in the relevant node, and identify affected dependencies before relying on them. Every lemma and proof must be readable without the global context.

    4. AUDITS/ contains only the current batch of independent audit reports and fresh-eyes solver reports, one Markdown file per report; audit-digest.md in the working directory is the controller's one-page merge of the current batch. When an audit batch starts, the controller pauses your research and moves all previous reports from AUDITS/ to audit_history/. Auditors read this same working directory directly, without copying the research files, and leave your records unchanged. On resumption, read audit-digest.md and answer every verdict and direction in the PLAN's AUDIT RESPONSES before continuing. Their advice does not override the statement or these instructions, but a STOP verdict from two or more auditors requires a written rebuttal in the node before the node stays ACTIVE. Leave AUDITS/, audit_history/, and audit-digest.md intact; the controller manages them. Older runs may also have audit.md; preserve it as historical advice.

    TURN-END CONTRACT. End every turn by pasting the current PLAN verbatim and nothing else about the records. Do not write a progress report unless the controller asks for one. Return a complete, self-contained solution only when it resolves the exact statement and every necessary claim is justified. A special case, reduction to an unproved claim, or progress report is not a complete solution. A counterexample resolves the task only if the statement permits that answer and its validity is fully proved.

    STATEMENT:
    [STATEMENT]
  critic: |-
    Act as a rigorous proof critic. Spawn multiple fresh independent subagents to
    aggressively find bugs in the exact statement and candidate proof. Give each
    the complete statement and proof and a different auditing focus. They must
    work independently, without communicating with one another, and report back
    to you. Wait for their reports before making your decision.

    Check every claim and inference, including boundary cases, hidden assumptions,
    circular reasoning, undefined terms or symbols, and omitted proof details.
    Treat statements that hide an argument behind words such as "clearly",
    "standard", or "similarly" as gaps when the necessary justification is absent.
    Ask the subagents to identify exactly what definitions and omitted arguments
    must be expanded to make the proof complete and rigorous.

    Examine their objections and try to fix every valid bug yourself, defining
    missing terms and fully expanding omitted arguments. If any issue cannot be
    rigorously fixed, return verdict=reject, every unresolved bug with its exact
    location in bugs, and your best complete candidate after safe fixes in solution.
    Otherwise return verdict=pass, an empty bugs string, and the complete corrected
    proof in solution. If no edits are needed, copy the candidate proof verbatim.
    Return only the requested JSON.

  goal: >-
    Resolve the exact statement in INITIAL_PROMPT.md with a complete, rigorous
    solution. At the start of every turn rewrite the PLAN section of
    APPROACHES/index.md from scratch and work on the cheapest untried ledger
    formulation of its MISSING step; maintain the other records as
    INITIAL_PROMPT.md defines.
  continuation: >-
    Continue the same statement. Before touching any node file: (1) run the record
    tool overview once and reread the PLAN; (2) rewrite the PLAN from scratch in
    your own words, then diff it against the old one and keep the better of each
    line; (3) name the single MISSING step and the ledger rows already tried with
    their failure reasons; (4) pick the cheapest untried row and spend this turn on
    it. Do not re-verify the index, links, or old lemmas unless a lemma you are
    about to use is in doubt. Do not re-read INITIAL_PROMPT.md. End the turn by
    pasting the PLAN. Do not report counts of nodes or lemmas.
  compaction: >-
    Context was compacted. Do not re-read INITIAL_PROMPT.md. Run the record tool
    overview once (python3 "$TCS_PROVER_TOOLS/records.py" overview) and open only
    the one node you were writing, by section. The rules that still bind you:
    weakest object first; existence theorems are feasibility certificates; ask
    object-or-process before representing any distribution; run the
    integralization checklist before proving obstructions; branch cap 90 minutes or
    3 descendant nodes; never cat whole files; at most 2 single-task subagents;
    end the turn by pasting the PLAN. Restate in two lines the MISSING step and
    what the current node contributes to it; if you cannot state the contribution,
    mark the node BLOCKED and return to the PLAN. The exact statement you are
    resolving is: {statement}
  checkpoint: >-
    Your context is nearly full and will be compacted soon. Before doing anything
    else, rewrite the PLAN section of APPROACHES/index.md from scratch so that it
    records the current MISSING step, the ledger rows tried in this window with
    their reasons, and the exact next action. Save any unrecorded idea from this
    window into the node it belongs to, then continue.
  subagent_compaction: >-
    Your context was compacted. Restate your single assigned task in two lines,
    finish only that task using the brief you were given, report the result to the
    root author, and stop. Do not read the whole record.
  resume: |-
    Resume the existing task in this working directory: {directory}
    Use your file tools to run the record tool overview first (python3
    "$TCS_PROVER_TOOLS/records.py" overview), then read INITIAL_PROMPT.md once and
    follow its current instructions and memory layout, including any explicit
    user-approved migration. Continue the same goal.
    If audit-digest.md or new reports in AUDITS/ are present, read the digest first
    and answer each verdict and direction in the PLAN's AUDIT RESPONSES before
    continuing. A STOP verdict from two or more auditors on one node sets it
    BLOCKED until you record a rebuttal in that node. Do not re-verify the index.
    Your original instructions are still in this conversation and in
    INITIAL_PROMPT.md; they are not repeated here. The exact statement is:
    {statement}
  repair: |-
    The following proof contains unresolved errors. The critic rejected round
    {round}. Read INITIAL_PROMPT.md and follow its instructions. Recover the
    relevant saved context, record the objections and any corrections, and
    continue the same goal toward a complete, rigorous solution.

    CURRENT CANDIDATE:
    {solution}

    CRITIC BUGS:
    {bugs}
  critic_input: |
    CRITIC INSTRUCTIONS:
    {instructions}

    STATEMENT:
    {statement}

    CANDIDATE SOLUTION:
    {solution}
