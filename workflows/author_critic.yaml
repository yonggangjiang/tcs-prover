# One persistent author session; the LLM maintains its research files.
nodes:
  author:
    run: goal
    role: author
    stage: solve
    prompt: author
    lifecycle: [goal, continuation, compaction, repair, resume]
    features: [multi_agent]
    task: state.statement
    marker: '[STATEMENT]'
    resume: {solution: state.solution, bugs: state.report.bugs, round: state.round}
    recovery: {when: "'report' in state and state.report.verdict == 'reject'", prompt: repair}
    outcome: result.outcome
    after:
    - merge: result
    - set:
        solution: "result.output if outcome == 'done' else get(state, 'solution', '')"
        failed: outcome == 'failure'
    next: {done: critic, failure: end}

  critic:
    run: structured
    role: critic
    stage: critic
    prompt: critic_input
    instructions: critic
    features: [multi_agent]
    inputs: {statement: state.statement, solution: state.solution}
    response: {verdict: [pass, reject], solution: string, bugs: string}
    require:
    - bool(strip(result.solution))
    - "not strip(result.bugs) if result.verdict == 'pass' else bool(strip(result.bugs))"
    outcome: "'reject' if result.verdict == 'reject' else ('pass' if normalized_text(result.solution) == normalized_text(state.solution) else 'fixed')"
    before:
    - write: {path: saved-candidate.md, text: state.solution}
    after:
    - set: {solution: strip(result.solution), report: result, round: visit}
    - write: {path: saved-candidate.md, text: state.solution}
    - emit: {kind: critic_result, label: 'Critic round {visit}', report: '=result', round: '=visit', text: '{raw}'}
    next:
      reject: author
      pass:
        to: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, text: 'Round {visit} passed without edits.'}
      fixed:
        repeat: 2
        option: critic_rounds
        then: end
        after:
        - set: {output: state.solution}
        - emit: {kind: status, label: Critic approved, text: 'Reached MAX ({limit} rounds); using the latest repaired proof.'}
prompts:
  # EDIT AUTHOR HERE: research freedom and all author-managed file instructions.
  author: |-
    Resolve the exact statement below with a complete, rigorous argument. Preserve its assumptions and requested conclusion. Think deeply and consider substantially diversified approaches.
    
    You, the author LLM, create, read, search, and update your research records using file tools. Inspect the working directory first. For a new run, create INITIAL_PROMPT.md with this entire initial author prompt verbatim, including the exact statement and every instruction; create APPROACHES/index.md with the heading "# Attempted approaches" and PROVED.md with "# Proved lemmas". Create files only if absent. For an existing run, read and follow its saved INITIAL_PROMPT.md and memory layout. 

    Maintain these research records in the current working directory:

    1. INITIAL_PROMPT.md is the permanent instruction file, containing the complete initial prompt and exact statement. Follow it throughout the task. Do not rewrite, shorten, or replace it without an explicit user instruction. Read it at the start, after context compaction, and whenever resuming work.

    2. APPROACHES/ contains a simple directed acyclic graph (DAG) of attempted approaches. Each node is a Markdown file with a stable ID and descriptive name, for example A001-xxx.md. An edge A -> B means that approach B developed from approach A; it records research history, not a claim that A is correct. An approach may have no parents or several parents, including failed approaches from which it learned. Parents must already exist when a child is created. Reusing an old idea in a new form can create a new child, never an edge back to an earlier node. Keep references to supporting proofs separate from these history edges.

    APPROACHES/index.md is a short navigation table with one row per node: linked ID and title, parent IDs, status, and a concise result or remaining question. This parent table defines the DAG; no other graph format is required. Keep untried ideas briefly in the index until investigated. Update the table when a node is added or its position changes, with links to the relevant detailed records. Use the index to locate arguments, not as a replacement for reading them.

    Each node file has this readable structure:

    # A001 — Descriptive title
    Parents: linked IDs, or none.
    Status: ACTIVE, PARKED, CLOSED, or RESOLVED.
    Summary: what this approach attempts.

    ## Context and objective
    Define the local problem, assumptions, notation, and connection to the original statement. Explain the relation to the parents and cite supporting lemmas by ID.

    ## Detailed work
    Append dated mathematical work with descriptive subsections: definitions, constructions or pseudocode, calculations, attempted proofs, examples, failures, repairs, and substantive subagent arguments. Explain nontrivial steps and significant decisions so another reader can understand and continue the work. Distinguish established results, incomplete arguments, and conjectures. Preserve earlier work when correcting it, with explicit links between an error and its correction.

    Continue updating a node while developing the same attempt. Create a child for a distinct attempt or a substantial development that deserves its own file, rather than for every helper lemma or edit. Split large records at meaningful subproblem boundaries, preserving the detailed work and links to its history. Include enough local context to read each node independently, while linking precise supporting sections instead of copying entire ancestor files. Read relevant arguments and their dependencies in full, using targeted sections rather than repeatedly loading the entire archive.

    ACTIVE means currently being developed; PARKED means unresolved, with the obstacle recorded; CLOSED means a precisely identified construction or claim has failed; RESOLVED means that node's stated objective is achieved. Record the exact evidence and scope of a failure, including what would have to change for a new attempt to address it. An unfinished proof is not a refutation, a failed variant does not close its whole research family, and a resolved subproblem does not resolve the full statement. Search related records before a new attempt to avoid repeating recorded failures in different words; record what is new when revisiting them.

    3. PROVED.md contains only rigorously established lemmas and complete proofs. Use stable IDs such as L001, precise statements with all assumptions, and clear links to the approach nodes each lemma supports or rules out. Positive and negative results are both welcome. Justify every inference and identify earlier lemmas or standard theorems used, including their required hypotheses. Experiments, conjectures, and arguments with gaps belong in the approach files. If a recorded lemma is found wrong, withdraw its proved status, preserve the erroneous argument and correction in the relevant node, and identify affected dependencies before relying on them. Routine repeated auditing of existing lemmas is not required.

    4. AUDITS/ contains independent audit reports, one Markdown file per report. When scheduled audits are enabled, the controller temporarily pauses your research, saves the independent reports here, and resumes your existing goal and conversation after the audit batch finishes. On resumption, read the latest reports before continuing. Consider their suggestions as advisory and decide whether to use them; they do not override the statement or these instructions. Leave the reports intact. Older runs may also have audit.md; preserve it as historical advice. You remain responsible for organizing and updating your own research records.

    Return a complete, self-contained solution only when it resolves the exact statement and every necessary claim is justified. A special case, reduction to an unproved claim, or progress report is not a complete solution. A counterexample resolves the task only if the statement permits that answer and its validity is fully proved.

    STATEMENT:
    [STATEMENT]
  critic: |-
    Act as a rigorous proof critic. Spawn multiple fresh independent subagents to
    aggressively find bugs in the exact statement and candidate proof. Give each
    the complete statement and proof and a different auditing focus. They must
    work independently, without communicating with one another, and report back
    to you. Wait for their reports before making your decision.

    Check every claim and inference, including boundary cases, hidden assumptions,
    circular reasoning, undefined terms or symbols, and omitted proof details.
    Treat statements that hide an argument behind words such as "clearly",
    "standard", or "similarly" as gaps when the necessary justification is absent.
    Ask the subagents to identify exactly what definitions and omitted arguments
    must be expanded to make the proof complete and rigorous.

    Examine their objections and try to fix every valid bug yourself, defining
    missing terms and fully expanding omitted arguments. If any issue cannot be
    rigorously fixed, return verdict=reject, every unresolved bug with its exact
    location in bugs, and your best complete candidate after safe fixes in solution.
    Otherwise return verdict=pass, an empty bugs string, and the complete corrected
    proof in solution. If no edits are needed, copy the candidate proof verbatim.
    Return only the requested JSON.

  goal: >-
    Resolve the exact statement in INITIAL_PROMPT.md with a complete, rigorous
    solution. Follow its instructions and maintain the research records it defines.
  continuation: >-
    Continue the same goal in this session. Read INITIAL_PROMPT.md and follow it;
    recover the relevant saved context using its memory layout. Preserve and
    update the research records. Return a complete, rigorous solution only when
    the exact statement is resolved.
  compaction: >-
    Context was compacted. Read INITIAL_PROMPT.md now and follow its instructions.
    Recover the relevant saved context using its memory layout, preserve the
    records, and continue the same goal.
  resume: |-
    Resume the existing task in this working directory: {directory}
    Use your file tools to read INITIAL_PROMPT.md first and follow its current
    instructions and memory layout, including any explicit user-approved migration.
    Recover the relevant saved context and preserve the research history. If
    the saved layout uses APPROACHES/INDEX.md or APPROACHES.md, retain that layout;
    do not silently migrate it. Continue the same goal. A previous interruption
    or usage limit was not a mathematical failure.
    If new reports are present in AUDITS/, read them and consider their advice
    before continuing; preserve any legacy audit.md as well.

    If INITIAL_PROMPT.md is missing, create it from the complete original initial
    author prompt below, without this continuation wrapper. Initialize other
    research records only if absent, following that prompt's instructions.
    Organize and maintain the research files yourself, following that prompt.

    ORIGINAL INITIAL AUTHOR PROMPT:
    {original_prompt}
  repair: |-
    The following proof contains unresolved errors. The critic rejected round
    {round}. Read INITIAL_PROMPT.md and follow its instructions. Recover the
    relevant saved context, record the objections and any corrections, and
    continue the same goal toward a complete, rigorous solution.

    CURRENT CANDIDATE:
    {solution}

    CRITIC BUGS:
    {bugs}
  critic_input: |
    CRITIC INSTRUCTIONS:
    {instructions}

    STATEMENT:
    {statement}

    CANDIDATE SOLUTION:
    {solution}
