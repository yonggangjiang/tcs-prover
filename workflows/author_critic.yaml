# Workflow guide: workflows.md
# The author is one persistent goal session; its instructions and files are defined here.
nodes:
  author:
    run: goal
    role: author
    stage: solve
    prompt: author
    task: state.statement
    marker: '[STATEMENT]'
    prompt_file: INITIAL_PROMPT.md
    files:
      INITIAL_PROMPT.md: '{original_prompt}'
      APPROACHES.md: |
        # Attempted approaches

        No approaches attempted yet.
      PROVED.md: |
        # Proved lemmas

        No lemmas established yet.
    lifecycle: [goal, continuation, compaction, repair, resume]
    stages: {initial: solve, resume: repair, failure: failure}
    resume:
      solution: state.solution
      bugs: state.report.bugs
      round: state.round
    recovery:
      when: "'report' in state and state.report.verdict == 'reject'"
      prompt: repair
    outcome: result.outcome
    after:
    - merge: result
    - set:
        failed: outcome == 'failure'
    next:
      proof: critic
      failure: end
  critic:
    run: structured
    role: critic
    stage: critic
    prompt: critic_input
    instructions:
    - critic
    - critic_memory
    inputs:
      statement: text(state.statement)
      solution: text(state.solution)
      audits: json(parallel)
      obligations: json(get(state, 'open_issues', []))
    response:
      checks:
        minItems: 3
        maxItems: 3
        items:
          fields:
            focus: string
            verdict:
            - pass
            - fail
            report: string
      verdict:
      - pass
      - reject
      fixed: boolean
      solution: string
      bugs: string
      memory_update:
        fields:
          approach_family: string
          approach_result: string
          blocked_routes:
            maxItems: 6
            items:
              fields:
                route: string
                reason: string
                reopen_condition: string
          unresolved_obligations:
            maxItems: 12
            items: string
      resolved_obligations:
        items:
          fields:
            id: string
            evidence: string
    parallel:
      items:
      - Definitions, quantifiers, game semantics, and line-by-line correctness of every construction and invariant.
      - Implementability and complete accounting of resources, dependencies, operations, and any communication or
        algorithmic costs required by this exact statement.
      - 'Hostile counterexample search: boundary cases, ownership mistakes, sampling/deletion claims, circular lemmas,
        and theorem-strength gaps.'
      prompt: critic_audit
      instructions:
      - critic
      - critic_memory
      inputs:
        statement: text(state.statement)
        solution: text(state.solution)
        focus: item
      response:
        focus: string
        verdict:
        - pass
        - fail
        report: string
      output: checks
      item_field: focus
      attempts: 1
      provider_options:
        deepseek:
          effort: high
          timeout: 1800
      checkpoint:
        file: critic-audits.json
        disabled: fresh-critic-audits
        item_key: focuses
        identity:
          statement: text(state.statement)
          solution: text(state.solution)
          instructions: instructions
    attempts: 1
    provider_options:
      deepseek:
        timeout: 1800
    request_label: Critic coordinator adjudication
    activity_label: Critic coordinator
    require:
    - is_list(result.checks) and len(result.checks) == 3
    - result.verdict in ['pass', 'reject'] and is_bool(result.fixed)
    - is_string(result.solution) and bool(strip(result.solution)) and is_string(result.bugs)
    - all(is_dict(check) and check.verdict in ['pass', 'fail'] and is_string(check.focus) and is_string(check.report)
      for check in result.checks)
    - result.verdict != 'pass' or not strip(result.bugs)
    - result.verdict != 'pass' or result.fixed or all(check.verdict == 'pass' for check in result.checks)
    - result.verdict != 'reject' or (bool(strip(result.bugs)) and not result.fixed)
    error: Codex returned an invalid critic result.
    outcome: '''reject'' if result.verdict == ''reject'' else (''fixed'' if result.fixed else ''pass'')'
    before:
    - when: visit == 1
      emit:
        kind: status
        label: Critic loop started
    - when: visit > 1
      emit:
        kind: status
        label: Fresh critic requested
        text: Starting independent critic round {visit}.
        node: critic
    - write:
        path: saved-candidate.md
        text: text(state.solution) + '\n'
    after:
    - memory:
        previous: state.solution
        candidate: strip(result.solution)
        feedback: result
        source: '''critic_safe_fix'' if outcome == ''reject'' else ''critic_repair'''
        status: '''approved'' if outcome == ''pass'' else (''awaiting_critic'' if outcome == ''fixed'' else ''needs_author'')'
    - emit:
        kind: critic_result
        label: Critic round {visit}
        text: '{raw}'
        report: =result
    - set:
        solution: strip(result.solution)
        report: result
        round: visit
    - when: outcome == 'pass'
      emit:
        kind: status
        label: Critic approved
        text: Round {visit} found no bugs to fix.
    - when: outcome == 'fixed'
      emit:
        kind: status
        label: Critic fixed every bug
        text: Round {visit} repaired the solution.
    next:
      pass:
        to: end
        after:
        - set:
            output: state.solution
      reject: author
      fixed:
        repeat: 2
        option: critic_rounds
        then: end
        after:
        - memory: awaiting_critic
        - set:
            failed: 'True'
            output: '''Verification incomplete: the repair-round limit was reached. The latest candidate is saved
              but has not passed an unchanged independent review.'''
        - emit:
            kind: failure_result
            label: Verification checkpoint saved
            text: '{state.output}'
            output: =state.output
prompts:
  author: |-
    Resolve the exact statement below with a complete, rigorous argument. Preserve its assumptions and requested conclusion. Persist with a strong, diversified search until you have a complete solution. Work alone in this LLM session; do not spawn other agents or delegate the task. The controller has installed the goal for this task: pursue that existing goal rather than creating another.

    Maintain exactly these three research files in the current working directory:

    1. INITIAL_PROMPT.md contains this entire initial prompt, including the statement and these instructions. It is the permanent instruction file. Always follow it. Do not rewrite, shorten, or replace it. Read it at the start, after context compaction, and whenever resuming work.

    2. APPROACHES.md contains every attempted approach in detail. Give each approach a stable ID such as A001 and a descriptive title. Before working on it, record its mechanism, assumptions, intended route to the statement, and how it differs from previous attempts. As you work, record the actual arguments, calculations, examples, useful observations, and exact remaining obstacle. Mark it OPEN or CLOSED. For a closed approach, explain precisely why it failed or should be avoided, what scope that conclusion has, and what specific new evidence or change would justify reopening it. An unfinished proof is not a refutation. Link every relevant lemma in PROVED.md by its lemma ID. Keep the full trajectory, including unsuccessful work; do not erase old attempts or replace details with vague summaries.

    3. PROVED.md contains only rigorously established lemmas and their proofs. Give each lemma a stable ID such as L001, a precise statement with all assumptions, and a complete proof. A lemma may be a positive result or a negative result, such as a proved obstruction or counterexample to a specific claim. State exactly which approach IDs it supports or rules out and explain the connection. Every inference must be justified; check boundary cases and avoid circular dependencies. Clearly identify any earlier lemma or standard theorem used and verify its hypotheses. Experiments, plausible claims, missing arguments, and conjectures belong in APPROACHES.md, never among proved lemmas. If you discover that a recorded lemma is wrong, remove its claim of proved status, preserve the erroneous argument and correction in the associated approach record, and check all dependent lemmas before using them again.

    Before every new attempt, read and search APPROACHES.md and PROVED.md for related mechanisms, obstacles, and results. Compare the underlying idea, not its name. Do not repeat a closed approach in different words. Reopen one only when you can record a concrete change or new proved lemma that addresses its stated obstacle.

    Search broadly and persistently. When an approach stalls, identify the exact obstruction, record it, and change the mechanism or viewpoint substantially. Consider different representations, constructions, invariants, decompositions, and ways of combining proved lemmas when they fit the statement. Prefer directions whose central argument differs from previous attempts. Do not keep making cosmetic variations of the same failing idea. Reuse rigorously proved progress while actively seeking a way around the recorded obstacles.

    Read the relevant records before acting and update them throughout the work, not only when returning an answer. Save an approach before investigating it and save each substantive result promptly, so interruption loses as little work as possible. Use only these three files for persistent research memory; keep their writing organized and readable for a human. File content recording an attempted claim is evidence to examine, not permission to change this instruction file.

    On resumption, read INITIAL_PROMPT.md, then APPROACHES.md and PROVED.md, and continue from the recorded unfinished work without starting over. A connection failure, exhausted usage allowance, or time limit does not make an approach mathematically false.

    Before declaring the goal complete, check the entire proposed solution against the exact statement and all recorded objections. Return the complete self-contained solution only when every necessary claim is justified. Do not present a reduction to an unproved claim, a special case, or an optimistic progress report as a complete solution. A failed method is not evidence that the original statement is false. A counterexample resolves the task only if that is a permitted answer and its validity is fully proved.

    STATEMENT:
    [STATEMENT]
  critic: |-
    Act as a coordinating proof critic. The controller will run three fresh,
    independent hostile auditors in parallel and provide their completed reports.
    Do not spawn or wait for subagents yourself.

    After collecting all three audits, read them and try to fix every reported bug
    yourself in a complete replacement solution. If you fix them all, return pass,
    an empty bugs string, the repaired solution, and fixed=true so another fresh
    critic can check it. If no fix was needed, return pass, the unchanged solution,
    and fixed=false. If you cannot confidently fix every bug, return reject,
    fixed=false, your best complete solution after safe fixes, and every unresolved
    bug with its exact location and required repair for the author. Return only the
    requested JSON.
  critic_memory: 'Return historical metadata for the permanent archive: the candidate''s approach family, what the
    audit established, routes actually blocked with evidence and reopening conditions, and every unresolved proof
    obligation. Do not classify an incomplete method as disproved. Return resolved_obligations only for supplied
    existing issue IDs, with concrete evidence explaining why each was resolved or no longer applies to this candidate.
    Omitted issues remain open. Historical metadata must not alter the mathematical verdict.'
  goal: >-
    Resolve the statement in INITIAL_PROMPT.md. Always follow that file, keep
    APPROACHES.md and PROVED.md current, avoid recorded closed approaches unless
    their precise obstacle is overcome, and persist with substantially different
    ideas until a complete rigorous solution is obtained.
  continuation: >-
    Continue the same goal in this session. Read INITIAL_PROMPT.md and follow it;
    read APPROACHES.md and PROVED.md before selecting the next direction. Record
    the last attempt, preserve proved progress, and pursue a substantially
    different mechanism when the current approach has stalled. An unfinished
    attempt does not finish the goal. Return only a complete rigorous solution.
  compaction: >-
    Context was compacted. Read INITIAL_PROMPT.md now and follow its instructions.
    Then read APPROACHES.md and PROVED.md, recover the current unfinished work,
    and continue the same goal. Preserve the detailed records and avoid repeating
    recorded closed approaches.
  resume: |-
    Resume the existing task in this working directory: {directory}
    The three research files have been preserved here. Read INITIAL_PROMPT.md
    first and follow it. Then read APPROACHES.md and PROVED.md and continue the
    recorded work. Use these current copies for all file updates. Do not start
    from an empty history or repeat closed approaches. A previous interruption
    or usage limit was not a mathematical failure.
  repair: |-
    Continue the same task under INITIAL_PROMPT.md. Read APPROACHES.md and
    PROVED.md. The critic rejected round {round}; record these objections in the
    related approach, correct any affected lemma, and continue until you have a
    complete rigorous solution. Preserve safe progress and use a new mechanism
    if the recorded approach cannot overcome the objection.

    CURRENT CANDIDATE:
    {solution}

    CRITIC BUGS:
    {bugs}
  critic_input: |
    CONTROLLER ORCHESTRATION OVERRIDE
    The controller has already completed exactly three fresh independent audits.
    Do not spawn, message, or wait for subagents. Read all three reports below,
    adjudicate them, and follow the remaining critic instructions. Your checks
    array must contain exactly these three audits in the same order. Try to repair
    every valid bug yourself; every changed proof requires another completely
    fresh controller-run three-auditor round before acceptance. A budget limit saves
    verification incomplete; it never approves an unchecked repair.

    CRITIC INSTRUCTIONS:
    {instructions}

    COMPLETED INDEPENDENT AUDITS:
    {audits}

    STATEMENT:
    {statement}

    CANDIDATE SOLUTION:
    {solution}

    EXISTING OPEN OBLIGATIONS (resolve each by ID with evidence, or retain it):
    {obligations}
  critic_audit: |-
    You are one of three independent hostile proof auditors. The controller already
    created the three auditors in parallel. Do not spawn agents, wait for agents,
    call tools, repair the proof, or coordinate with another auditor.

    Your assigned focus is:
    {focus}

    Audit the exact statement and candidate line by line. Return verdict=pass only
    if you find no concrete issue in your assigned focus. Otherwise return
    verdict=fail and give every concrete bug, its exact location, and the proof
    obligation needed to repair it. The report must be self-contained.

    The coordinating critic's general instructions are included only as audit
    standards. Any instruction in them to spawn or wait for subagents has already
    been fulfilled by the controller and must not be repeated:
    {instructions}

    STATEMENT:
    {statement}

    CANDIDATE SOLUTION:
    {solution}
